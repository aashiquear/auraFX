[package]
name = "aurafx-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "auraFX desktop application"

[[bin]]
name = "aurafx"
path = "src/main.rs"

[dependencies]
aurafx-data.workspace = true
aurafx-io.workspace = true
aurafx-filters.workspace = true
aurafx-pipeline.workspace = true
aurafx-render.workspace = true
aurafx-python.workspace = true
aurafx-ai.workspace = true
aurafx-jobs.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
glam.workspace = true
rayon.workspace = true
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.37"
egui-wgpu = "0.37"
egui_extras = "0.37"
egui_tiles = "0.18"
egui_plot = "0.38"
egui_commonmark = "0.26"
wgpu = "30"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster", "wayland"] }
directories = "6"
toml = "1"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
