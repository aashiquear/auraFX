# The version shown to users, and the version code Google Play orders uploads by: every upload
# needs a higher code than the last one. scripts/package/android_studio.sh fills both from the
# auraFX version (code = major*10000 + minor*100 + patch); raise the code here for another
# upload of the same version, or pass -PversionCode=... to Gradle.
versionName=@VERSION_NAME@
versionCode=@VERSION_CODE@
