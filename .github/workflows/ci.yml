name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy (embedded Python tests)
        run: python -m pip install numpy
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgtk-3-dev mesa-vulkan-drivers
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        # GPU tests skip themselves when no adapter is available.
        run: cargo test --workspace --no-fail-fast
      - name: Clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true
