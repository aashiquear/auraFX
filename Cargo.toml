[workspace]
resolver = "2"
members = ["crates/*"]
# The B-rep kernel is carried in vendor/ (see vendor/README.md): its crates are path dependencies of
# aurafx-cad and belong to the vendored workspaces, not to this one.
exclude = ["vendor"]
default-members = ["crates/aurafx-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aashiquear/auraFX"
rust-version = "1.95"

[workspace.dependencies]
aurafx-data = { path = "crates/aurafx-data" }
aurafx-io = { path = "crates/aurafx-io" }
aurafx-filters = { path = "crates/aurafx-filters" }
aurafx-gpu = { path = "crates/aurafx-gpu" }
aurafx-pipeline = { path = "crates/aurafx-pipeline" }
aurafx-render = { path = "crates/aurafx-render" }
aurafx-python = { path = "crates/aurafx-python" }
aurafx-ai = { path = "crates/aurafx-ai" }
aurafx-jobs = { path = "crates/aurafx-jobs" }
aurafx-crystal = { path = "crates/aurafx-crystal" }
aurafx-mesh = { path = "crates/aurafx-mesh" }
aurafx-cad = { path = "crates/aurafx-cad" }

anyhow = "1"
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
rayon = "1.10"
bytemuck = { version = "1", features = ["derive"] }
glam = { version = "0.34", features = ["bytemuck"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
half = { version = "2", features = ["serde"] }

[profile.dev]
opt-level = 1
# Line numbers only (backtraces keep file and line); full debug info for a debugger session with
# CARGO_PROFILE_DEV_DEBUG=2. Full debug info everywhere made target/debug grow past 300 GB.
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3
debug = false
[profile.release]
lto = "thin"
codegen-units = 4

# solidcraft pins solidcore by git revision; the same revision is carried in vendor/solidcore, so a build
# needs nothing from the network but crates.io (docs/reference/third-party.md).
[patch."https://github.com/tangency-labs/solidcore"]
solidcore = { path = "vendor/solidcore/crates/solidcore" }
solidcore-record = { path = "vendor/solidcore/crates/solidcore-record" }
