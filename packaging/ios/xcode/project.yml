# The Xcode project of the auraFX iOS app, generated with XcodeGen (brew install xcodegen;
# `xcodegen generate` in this folder). scripts/package/ios_xcode.sh fills the @...@ values,
# builds lib/libaurafx_ios.a and writes the project; the generated auraFX.xcodeproj is in the zip.
name: auraFX
options:
  bundleIdPrefix: org.aurafx
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "@VERSION@"
    CURRENT_PROJECT_VERSION: "@BUILD@"
    ENABLE_BITCODE: "NO"
targets:
  auraFX:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
    # The app does not use the scene life cycle yet (its window library starts the earlier way),
    # and iOS 27 stops such an app at launch when it says it was built with the iOS 27 SDK:
    # say iOS 26 (see scripts/package/ios_sdk_stamp.py). Runs before code signing.
    postBuildScripts:
      - name: Stamp the SDK version
        basedOnDependencyAnalysis: false
        script: |
          xcrun vtool -set-build-version ios 15.0 26.0 -replace -output "$TARGET_BUILD_DIR/$EXECUTABLE_PATH" "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.aurafx.app
        PRODUCT_NAME: auraFX
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: iphoneos
        SDKROOT: iphoneos
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: "NO"
        LIBRARY_SEARCH_PATHS: "$(PROJECT_DIR)/lib"
        OTHER_LDFLAGS: "-laurafx_ios @NATIVE_LIBS@"
        DEAD_CODE_STRIPPING: "YES"
        STRIP_INSTALLED_PRODUCT: "YES"
