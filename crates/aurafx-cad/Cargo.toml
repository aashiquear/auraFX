[package]
name = "aurafx-cad"
description = "auraFX's parametric CAD document: feature timeline, constrained sketches, parameters and expressions, with an implicit kernel and (feature brep) a B-rep kernel through SolidCraft"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
# The B-rep kernel and the CAD file formats through the SolidCraft crates (git, pinned; see
# docs/design/cad-environment.md section 3.3). Stage C6 adds the dependencies.
brep = []

[dependencies]
aurafx-data.workspace = true
aurafx-mesh.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true
